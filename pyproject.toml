[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ginsign"
version = "0.2.0"
description = "Grounding Natural Language into System Signatures for Temporal Logic"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "William Hepp English" },
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat"]
wandb = ["wandb>=0.16"]
openai = ["openai>=1.0", "python-dotenv"]
all = ["wandb>=0.16", "openai>=1.0", "python-dotenv"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ginsign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
